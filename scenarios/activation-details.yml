# FinTech Banking Scenarios: Card Activation and Security Channel Verification
scenarios:
  - name: "Submit Card Activation and Verify Channels"
    flow:
      - function: "setRequestParams"
      - post:
          url: "/api/v1/activation-details"
          headers:
            Content-Type: "application/json"
            Authorization: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.mock"
          json:
            cardUid: "{{ creditCardUid }}"
            customerName: "{{ name }}"
            activationDate: "{{ date }}"
            verificationChannel: "SMS_OTP"
          afterResponse: "printStatus"
