# FinTech Banking Scenarios: Pay-Off Demand Letter Generation
scenarios:
  - name: "Generate Pay-off Demand Letter"
    flow:
      - function: "setRequestParams"
      - post:
          url: "/api/v1/pay-off-letter"
          headers:
            Content-Type: "application/json"
            Authorization: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.mock"
          json:
            creditCardUid: "{{ creditCardUid }}"
            title: "{{ title }}"
            settlementAmount: "{{ settlementAmount }}"
            letterDate: "{{ date }}"
          afterResponse: "printStatus"
