# ==============================================================================
# Artillery Configuration: get-phone-textability [UAT Pre-Release Cluster]
# Multi-Phase Load Curve & Automated SLA Quality Gating
# ==============================================================================
config:
  target: "http://localhost:8088"
  processor: "../../support/helper.js"
  payload:
    path: "../data/customers.csv"
    fields:
      - "customerUid"
      - "name"
      - "tier"
      - "cardUid"
      - "currentBalance"
      - "phone"
      - "creditLimit"
      - "riskScore"
      - "isDelinquent"
    order: "sequence"
    skipHeader: true


  ensure:
    p95: 350
    p99: 650
    maxErrorRate: 0.01

  environments:
    smoke:
      target: "http://localhost:8088"
      phases:
        - duration: 5
          arrivalRate: 2
          name: "Smoke Verification (Low Concurrency)"
      ensure:
        p95: 350
        p99: 650
        maxErrorRate: 0.01

    load:
      target: "http://localhost:8088"
      phases:
        - duration: 15
          arrivalRate: 5
          name: "Phase 1: Warm-up"
        - duration: 30
          arrivalRate: 15
          rampTo: 50
          name: "Phase 2: Linear Ramp-up"
        - duration: 45
          arrivalRate: 50
          name: "Phase 3: Sustained Peak Concurrency"
      ensure:
        p95: 400
        p99: 750
        maxErrorRate: 0.02

    stress:
      target: "http://localhost:8088"
      phases:
        - duration: 10
          arrivalRate: 10
          name: "Phase 1: Traffic Baseline"
        - duration: 30
          arrivalRate: 50
          rampTo: 200
          name: "Phase 2: Steep Spike Surge"
        - duration: 20
          arrivalRate: 200
          name: "Phase 3: Saturation Threshold"
      ensure:
        p95: 600
        p99: 1200
        maxErrorRate: 0.05
